name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: textarea
    attributes: { label: Reproduction, description: Include a minimal repository or steps. }
    validations: { required: true }
  - type: textarea
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: input
    attributes: { label: Package and version }
    validations: { required: true }
  - type: textarea
    attributes: { label: Browser, framework, and accessibility impact }
