name: Publish npm packages
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm pack:local
      - name: Publish public packages with provenance
        run: |
          pnpm --filter @universal-vue/tokens publish --access public --provenance --no-git-checks
          pnpm --filter @universal-vue/icons publish --access public --provenance --no-git-checks
          pnpm --filter @universal-vue/utilities publish --access public --provenance --no-git-checks
          pnpm --filter @universal-vue/metadata publish --access public --provenance --no-git-checks
          pnpm --filter @universal-vue/vue publish --access public --provenance --no-git-checks
          pnpm --filter @universal-vue/elements publish --access public --provenance --no-git-checks
